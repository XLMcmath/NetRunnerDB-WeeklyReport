# NetrunnerDB 每周牌组摘要 · nginx 配置
#
# 用法：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/netrunnerdb-weekly
#   sudo ln -s /etc/nginx/sites-available/netrunnerdb-weekly /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 站点文件放在 /var/www/netrunnerdb-weekly（见 deploy/upload_to_vps.ps1）

server {
    listen 80;
    listen [::]:80;

    # 有域名就换成你的域名；没有就留 _ （直接用 IP 访问）
    server_name _;

    root /var/www/netrunnerdb-weekly;
    index index.html;

    charset utf-8;
    charset_types text/html text/css application/json text/markdown text/plain;

    # 卡牌缩略图基本不变，缓存久一点
    location ~* \.(?:jpg|jpeg|png|webp|ico|css|js)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # HTML 每次拉新的，方便每周内容更新
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json text/markdown application/javascript;

    # 隐藏文件和日志别暴露（tar 解包时可能带上）
    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/netrunnerdb-weekly.access.log;
    error_log  /var/log/nginx/netrunnerdb-weekly.error.log;
}
