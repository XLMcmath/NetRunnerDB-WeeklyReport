name: 每周牌组摘要

# 每周一 01:00 UTC（北京 09:00）自动抓取，把新一期提交进仓库，Pages 自动重新发布
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch: # 也可以在 Actions 页面手动点一次

permissions:
  contents: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        # openpyxl 用于读 card_names_zh.xlsx（译名表）；缺了会自动退化成英文名
        run: pip install lxml openpyxl

      - name: 抓取并生成（写到仓库根目录，历史期数会累积）
        run: python nrdb_weekly.py --out .

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "本周没有变化，跳过提交"
          else
            git commit -m "weekly digest: $(date -u +%G-W%V)"
            git push
          fi
